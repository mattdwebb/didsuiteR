name: R contract checks
on: [push, pull_request, workflow_dispatch]
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
      _R_CHECK_FORCE_SUGGESTS_: false
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - name: Install public harness dependencies
        run: Rscript -e 'install.packages(c("digest","jsonlite"), repos="https://cloud.r-project.org")'
      - name: Build and check without optional estimator backends
        run: |
          R CMD build .
          R CMD check --no-manual didsuiteR_*.tar.gz
